<!DOCTYPE html>
<html lang='en' xmlns='http://www.w3.org/1999/xhtml' xmlns:v='urn:schemas-microsoft-com:vml' xmlns:o='urn:schemas-microsoft-com:office:office'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='x-apple-disable-message-reformatting'>
    <meta name='color-scheme' content='light'>
    <title>{{Title}}</title>
    <!--[if mso]>
    <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <![endif]-->
</head>

<body style='margin:0;padding:0;background-color:#f3f4f6;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;'>

    <div style='display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;'>{{Preheader}}</div>

    <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' bgcolor='#f3f4f6' style='background-color:#f3f4f6;'>
        <tr>
            <td align='center' style='padding:24px 12px;'>

                <!--[if mso]><table role='presentation' width='620' cellpadding='0' cellspacing='0' border='0'><tr><td><![endif]-->
                <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='max-width:620px;border-radius:8px;overflow:hidden;'>

                    {{{LogoBlock}}}

                    <tr>
                        <td bgcolor='#ffffff' style='background-color:#ffffff;padding:22px 28px 16px 28px;border-bottom:3px solid {{HeaderColor}};'>
                            <!--<div style='font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:1px;color:#64748b;text-transform:uppercase;'>CRM Notification</div>-->
                            <div style='font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:1px;color:#64748b;text-transform:uppercase;'>{{HeaderLabel}}</div>
                            <div style='font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:{{HeaderColor}};padding-top:4px;'>{{Title}}</div>
                        </td>
                    </tr>

                    <tr>
                        <td bgcolor='#ffffff' style='background-color:#ffffff;padding:24px 28px 28px 28px;'>
                            {{{Content}}}
                        </td>
                    </tr>

                    <tr>
                        <td bgcolor='#f9fafb' style='background-color:#f9fafb;padding:18px 28px;border-top:1px solid #e5e7eb;'>
                            <p style='margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6b7280;text-align:center;'>
                                Regards,<br>
                                <b>Rajkamal CRM System</b><br>
                                This is an automated message. Please do not reply to this email.
                            </p>
                        </td>
                    </tr>

                </table>
                <!--[if mso]></td></tr></table><![endif]-->

            </td>
        </tr>
    </table>

</body>
</html>
