<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='margin:0 0 20px 0;'>
    <tr>
        <td align='left' valign='middle'>
            <table role='presentation' cellpadding='0' cellspacing='0' border='0'>
                <tr>
                    <td bgcolor='#fee2e2' style='background-color:#fee2e2;border-radius:999px;padding:6px 14px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.6px;color:#991b1b;'>
                        &#128226;&nbsp; COMPANY ANNOUNCEMENT
                    </td>
                </tr>
            </table>
        </td>
        <td align='right' valign='middle' style='font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#64748b;'>
            {{AnnouncementDate}}
        </td>
    </tr>
</table>

<p style='margin:0 0 14px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#0f172a;'>
    Dear <b>{{EmployeeName}}</b>,
</p>
<p style='margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#475569;'>
    Please read the following announcement from the management.
</p>

<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0'>
    <tr>
        <td bgcolor='#f8fafc' style='background-color:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid #c8161d;border-radius:8px;padding:20px 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:26px;color:#1e293b;'>
            {{{MessageHtml}}}
        </td>
    </tr>
</table>

<p style='margin:18px 0 22px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#64748b;'>
    If you have any questions, please contact the HR Department.
</p>

<div style='border-top:1px solid #e2e8f0;height:1px;line-height:1px;font-size:1px;'>&nbsp;</div>

<p style='margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#475569;'>
    Regards,<br>
    <b style='color:#c8161d;'>Management Team</b><br>
    <span style='font-size:12px;color:#64748b;'>{{CompanyName}}</span>
</p>
