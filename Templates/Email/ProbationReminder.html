<p style='margin:0 0 6px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#0f172a;'>Hello,</p>
<p style='margin:0 0 18px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:22px;color:#475569;'>
    This is a reminder that an employee's probation period is about to end.
</p>

<table role='presentation' cellpadding='0' cellspacing='0' border='0' style='margin:0 0 20px 0;'>
    <tr>
        <td bgcolor='#fee2e2' style='background-color:#fee2e2;border-radius:999px;padding:6px 14px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.6px;color:#991b1b;'>
            &#9679;&nbsp; PROBATION ENDING
        </td>
    </tr>
</table>

<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0'>
    <tr>
        <td width='50%' valign='top' style='padding:0 6px 12px 0;'>
            <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border:1px solid #e2e8f0;border-radius:8px;'>
                <tr>
                    <td bgcolor='#f8fafc' style='background-color:#f8fafc;border-radius:8px;padding:12px 14px;'>
                        <div style='font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.8px;color:#64748b;text-transform:uppercase;'>Employee</div>
                        <div style='font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#0f172a;padding-top:4px;'>{{EmployeeName}}</div>
                    </td>
                </tr>
            </table>
        </td>
        <td width='50%' valign='top' style='padding:0 0 12px 6px;'>
            <table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border:1px solid #e2e8f0;border-radius:8px;'>
                <tr>
                    <td bgcolor='#fef2f2' style='background-color:#fef2f2;border-radius:8px;padding:12px 14px;'>
                        <div style='font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.8px;color:#991b1b;text-transform:uppercase;'>Probation Ends On</div>
                        <div style='font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#991b1b;padding-top:4px;'>{{ProbationEndDate}}</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border:1px solid #e2e8f0;border-radius:8px;'>
    <tr>
        <td bgcolor='#f8fafc' style='background-color:#f8fafc;border-radius:8px;padding:12px 14px;'>
            <div style='font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.8px;color:#64748b;text-transform:uppercase;'>You are notified as</div>
            <div style='font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#0f172a;padding-top:4px;'>{{RecipientRole}}</div>
        </td>
    </tr>
</table>

<div style='height:16px;line-height:16px;font-size:16px;'>&nbsp;</div>

<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0'>
    <tr>
        <td bgcolor='#fef2f2' style='background-color:#fef2f2;border-left:4px solid #c8161d;border-radius:6px;padding:14px 16px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#7f1d1d;'>
            <b>Action needed</b><br>
            Please review and take the required action before the probation period ends.
        </td>
    </tr>
</table>
